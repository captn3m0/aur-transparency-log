MAX_CANDIDATES = "15"
LOOKBACK = "1800"
REKOR_URL = "https://log2025-1.rekor.sigstore.dev"
TSA_URLS = "https://timestamp.sigstore.dev/api/v1/timestamp"
TSA_MIN = "1"
