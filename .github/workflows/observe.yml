name: observe

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: observe
  cancel-in-progress: false

jobs:
  observe:
    if: github.repository == 'captn3m0/aur-transparency-log'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .state/state.json
          key: state-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: state-

      - id: obs
        run: PYTHONPATH=src python3 -m aurlog observe --state .state --out out

      - id: attest
        if: steps.obs.outputs.has_entries == 'true'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: out/subjects.txt
          predicate-type: https://captn3m0.github.io/aur-transparency-log/aur-published/v1
          predicate-path: out/predicate.json

      - if: steps.obs.outputs.has_entries != 'true' || steps.attest.outcome == 'success'
        run: PYTHONPATH=src python3 -m aurlog commit --state .state

      - if: always()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .state/state.json
          key: state-${{ github.run_id }}-${{ github.run_attempt }}
